[project]
site_name = "rnwolf.net"
site_url = "https://www.rnwolf.net"
site_description = "A personal blog and portfolio of Rüdiger Wolf."
site_author = "rnwolf"
copyright = """
&copy; Rüdiger Wolf 2025. All rights reserved.
"""

extra_css = [
  "stylesheets/extra.css",
  "stylesheets/newsletter.css",
]
extra_javascript = [
  # Self-hosted, so the theme uses it instead of fetching from unpkg (blocked by CSP)
  "javascripts/mermaid.min.js",
  "javascripts/posthog-script.js",
  "javascripts/newsletter.js",
]

exclude_docs = "!.well-known"

nav = [
  "index.md",
  { "Blog" = [
    "blog/index.md",
    { "Tags" = "tags.md" },
  ] },
  { "About" = "about.md" },
  { "Resources" = [
    "resources/index.md",
    { "Agile" = "resources/agile.md" },
    { "AI" = "resources/ai.md" },
    { "Books" = "resources/books.md" },
    { "CCPM" = "resources/ccpm.md" },
    { "DBR" = "resources/dbr.md" },
    { "Delivery Management" = "resources/dm.md" },
    { "Health" = "resources/health.md" },
    { "Podcasts" = "resources/podcasts.md" },
    { "Product Management" = "resources/pm.md" },
    { "Personal Finance" = "resources/personal-finance.md" },
    { "Programming" = "resources/programming.md" },
    { "Python" = "resources/python.md" },
    { "South Africa" = "resources/south-africa.md" },
    { "Tameflow" = "resources/tameflow.md" },
    { "Time Management" = "resources/time-management.md" },
    { "TOC" = "resources/toc.md" },
    { "Tools" = "resources/tools.md" },
    { "United Kingdom" = "resources/united-kingdom.md" },
    { "Workflow Management" = "resources/workflow-management.md" },
    { "Value" = "resources/value.md" },
    { "YouTube" = "resources/youtube.md" },
  ] },
  { "Contact" = "contact.md" },
  { "Projects" = [
    "projects/our-planner/index.md",
    "projects/pyccpm/index.md",
  ] },
]

[project.theme]
name = "material"
locale = "en"
custom_dir = "overrides"
icon.logo = "fontawesome/solid/lightbulb"
features = [
  "navigation.footer",
  "navigation.tabs",
  "navigation.top",
  "content.code.annotate",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"
primary = "blue"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"
primary = "deep orange"
accent = "deep purple"

[project.plugins.meta]

[project.plugins.tags]

[project.plugins.social]

[project.plugins.search]

[project.plugins.blog]
blog_dir = "blog"
categories_allowed = [
  "technology",
  "health",
  "performance",
  "development",
  "finance",
  "ai",
]

[project.plugins.rss]
use_material_blog = true
use_material_social_cards = true
use_git = false
pretty_print = true
match_path = "blog/posts/.*"
date_from_meta.as_creation = "date.created"
date_from_meta.as_update = "date.updated"
date_from_meta.datetime_format = "%Y-%m-%d %H:%M"
date_from_meta.default_timezone = "Europe/London"

[[project.extra.social]]
icon = "simple/youtube"
link = "https://www.youtube.com/@RudigerWolf"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/rnwolf"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/rnwolf"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/rudigerwolf/"

[[project.extra.social]]
icon = "fontawesome/solid/rss"
link = "/feed_rss_updated.xml"

[[project.extra.footer_links]]
text = "Privacy Policy"
href = "/privacy"

[[project.extra.footer_links]]
text = "Security Policy"
href = "/security-policy"

[[project.extra.footer_links]]
text = "Copyright"
href = "/copyright"

[[project.extra.footer_links]]
text = "Newsletter"
href = "/newsletter"

[[project.extra.footer_links]]
text = "RSS Feed by created date"
href = "/feed_rss_created.xml"

[project.markdown_extensions]
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = {}
admonition = {}
"pymdownx.arithmatex" = { generic = true }
footnotes = {}
"pymdownx.details" = {}
"pymdownx.mark" = {}
attr_list = {}
md_in_html = {}
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
"pymdownx.superfences" = { custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }
toc = { permalink = true }
